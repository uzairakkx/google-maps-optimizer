services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: google_maps_optimizer
      POSTGRES_USER: gmo
      POSTGRES_PASSWORD: gmo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmo -d google_maps_optimizer"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      APP_ENV: development
      APP_NAME: google-maps-optimizer-api
      API_HOST: 0.0.0.0
      API_PORT: 8000
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://gmo:gmo@postgres:5432/google_maps_optimizer
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  celery:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      APP_ENV: development
      APP_NAME: google-maps-optimizer-worker
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://gmo:gmo@postgres:5432/google_maps_optimizer
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.worker.celery_app:celery_app", "worker", "--loglevel=INFO"]

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/workspace/apps/web
      - web-node-modules:/workspace/apps/web/node_modules
      - web-next:/workspace/apps/web/.next
    depends_on:
      api:
        condition: service_started
    command: ["pnpm", "--dir", "apps/web", "dev"]

volumes:
  postgres-data:
  redis-data:
  web-node-modules:
  web-next: